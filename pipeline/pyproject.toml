[project]
name = "kg-pipeline"
version = "0.1.0"
description = "Knowledge graph ingestion pipeline for coding agents"
requires-python = ">=3.11"
dependencies = [
  "tree-sitter==0.26.0",
  "tree-sitter-language-pack==1.23.1",
  "protobuf>=6.31,<7",
  "neo4j==6.4.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# dagster-postgres and dagster-k8s: run pods read the instance from PostgreSQL and use the K8s launcher
dagster = ["dagster==1.13.28", "dagster-postgres==0.29.28", "dagster-k8s==0.29.28", "sqlalchemy>=2.0,<2.1"]  # 2.1 switches postgresql:// to psycopg 3
# Control API (kg_pipeline/control): FastAPI app, Fernet secrets, Keycloak JWT, Dagster GraphQL client
control = ["fastapi>=0.115", "uvicorn>=0.30", "cryptography>=43", "PyJWT[crypto]>=2.9", "dagster-graphql==1.13.28", "httpx>=0.27", "sqlalchemy>=2.0,<2.1"]
dev = ["pytest>=8", "ruff>=0.14"]
# OpenTelemetry tracing (kg_pipeline/telemetry.py); off unless OTEL_EXPORTER_OTLP_ENDPOINT is set
otel = ["opentelemetry-sdk>=1.38,<2", "opentelemetry-exporter-otlp-proto-http>=1.38,<2"]

[project.scripts]
kg-ingest-code = "kg_pipeline.code.ingest:main"
kg-domain = "kg_pipeline.domain.extract:main"
kg-embed = "kg_pipeline.vectors:main"
kg-search = "kg_pipeline.search:main"
kg-verify = "kg_pipeline.requirements:main"
kg-eval = "kg_pipeline.evaluate:main"
kg-jira = "kg_pipeline.sources.jira:main"
kg-git-history = "kg_pipeline.sources.history:main"
kg-docs = "kg_pipeline.sources.documents:main"
kg-dedupe = "kg_pipeline.dedupe:main"
kg-summaries = "kg_pipeline.summaries:main"
kg-freshness = "kg_pipeline.freshness:main"
kg-corrections = "kg_pipeline.corrections:main"
kg-github = "kg_pipeline.sources.github:main"
kg-catalog = "kg_pipeline.sources.catalog:main"
kg-people = "kg_pipeline.people:main"
kg-links = "kg_pipeline.code.links:main"
kg-permissions = "kg_pipeline.sources.permissions:main"
kg-review = "kg_pipeline.review:main"
kg-fake-embedder = "kg_pipeline.fake_embed:main"
kg-backup = "kg_pipeline.backup:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kg_pipeline*"]

# Lint in CI: pyflakes and syntax errors only; the code style allows short names and named lambdas.
[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["kg_pipeline/code/scip_pb2.py", "tests/fixtures/bookshop"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731", "E741"]
