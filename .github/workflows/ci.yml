# CI for the knowledge graph: lint and unit tests, image builds (no push), Helm checks, and an
# integration job that ingests the bookshop fixture into a Neo4j service container (LLM off, fake
# embedder) and gates on kg-eval. Actions are pinned by commit SHA; the comment gives the tag.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  workflows:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: mcp/go.mod
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  go:
    name: go vet and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  python:
    name: ruff and pytest
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e ".[dev,dagster,otel]"
      - run: ruff check .
      - run: pytest -q

  images:
    name: docker build ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [mcp, pipeline]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          push: false
          tags: kg-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  helm:
    name: helm lint and template
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: deploy/helm/knowledge-graph
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: lint and template every values file
        run: |
          for f in values*.yaml; do
            echo "::group::$f"
            helm lint . -f "$f"
            helm template kg . -f "$f" > /dev/null
            echo "::endgroup::"
          done
      - name: template optional components
        run: |
          helm template kg . --set mcp.enabled=true --set mcp.image=kg-mcp:ci > /dev/null
          helm template kg . --set backup.enabled=true --set backup.image=kg-pipeline:ci > /dev/null
          helm template kg . --set backup.enabled=true --set backup.image=kg-pipeline:ci \
            --set backup.target=s3 --set backup.s3.secretName=kg-backup-s3 > /dev/null
      - name: control API is off by default
        run: |
          helm template kg . > "$RUNNER_TEMP/default.yaml"
          if grep -q -e '^  name: kg-control' -e 'CONTROL_API_URL' -e '^  KG_SECRET_KEY: ' "$RUNNER_TEMP/default.yaml"; then
            echo "default values must render no control resources and no CONTROL_API_URL"
            grep -n -e '^  name: kg-control' -e 'CONTROL_API_URL' -e '^  KG_SECRET_KEY: ' "$RUNNER_TEMP/default.yaml"
            exit 1
          fi
          helm template kg . --set web.enabled=true --set web.image=kg-web:ci > "$RUNNER_TEMP/web.yaml"
          if grep -q 'CONTROL_API_URL' "$RUNNER_TEMP/web.yaml"; then
            echo "web must not get CONTROL_API_URL when control.enabled=false"
            exit 1
          fi
      - name: control API renders with its env
        run: |
          out="$RUNNER_TEMP/control.yaml"
          helm template kg . --set control.enabled=true --set control.image=kg-pipeline:ci \
            --set web.enabled=true --set web.image=kg-web:ci \
            --set control.oidc.issuer=https://sso.example.com/realms/kg --set control.oidc.audience=kg-mcp > "$out"
          expect() {
            if ! grep -q -F -e "$1" "$out"; then
              echo "missing in rendered control chart: $1"
              exit 1
            fi
          }
          expect 'kind: Deployment'
          expect 'name: kg-control'
          expect 'port: 8090'
          expect 'containerPort: 8090'
          expect 'path: /healthz'
          expect 'name: DATABASE_URL'
          expect 'name: KG_SECRET_KEY'
          expect 'KG_SECRET_KEY: "'
          expect 'name: KG_OIDC_ISSUER'
          expect 'name: KG_OIDC_AUDIENCE'
          expect 'name: KG_OIDC_GROUPS_CLAIM'
          expect 'name: DAGSTER_GRAPHQL_HOST'
          expect 'value: "kg-dagster-webserver"'
          expect 'name: DAGSTER_GRAPHQL_PORT'
          expect 'value: "80"'
          expect 'value: "http://kg-control:8090"'
          # Service kg-control, and Dagster user code env (also copied to run pods) with both variables
          test "$(awk '/^kind: Service$/{s=1;next} s&&/^  name: kg-control$/{print "svc";s=0} /^---/{s=0}' "$out")" = svc
          grep -q 'DAGSTER_CLI_API_GRPC_CONTAINER_CONTEXT' "$out"
          grep -q -F '\"name\":\"KG_SECRET_KEY\"' "$out"
          grep -q -F '\"name\":\"DATABASE_URL\"' "$out"
          helm lint . --set control.enabled=true --set control.image=kg-pipeline:ci --set web.enabled=true --set web.image=kg-web:ci

  integration:
    name: ingest fixture and evaluate
    runs-on: ubuntu-24.04
    needs: [go, python]
    services:
      neo4j:
        image: neo4j:2026.10.1
        env:
          NEO4J_AUTH: neo4j/kg-ci-${{ github.run_id }}
          NEO4J_server_memory_heap_max__size: 1G
          NEO4J_server_memory_pagecache_size: 512M
        ports: ["7687:7687"]
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: kg-ci-${{ github.run_id }}
      EMBEDDINGS_URL: http://127.0.0.1:8089
      EMBEDDINGS_MODEL: fake
      EMBEDDINGS_DIMENSIONS: "256"
      KG_DEFAULT_REPO: bookshop
      KG_MCP_URL: http://127.0.0.1:8000/mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      - name: install
        working-directory: pipeline
        run: pip install -e ".[dev,otel]"
      - name: start the fake embedder
        run: |
          nohup kg-fake-embedder --port 8089 --dimensions 256 > fake-embedder.log 2>&1 &
          for _ in $(seq 30); do curl -sf http://127.0.0.1:8089/ && break; sleep 1; done
      - name: wait for neo4j
        run: |
          python - <<'EOF'
          import os, time
          from neo4j import GraphDatabase
          d = GraphDatabase.driver(os.environ["NEO4J_URI"], auth=(os.environ["NEO4J_USER"], os.environ["NEO4J_PASSWORD"]))
          for _ in range(60):
              try:
                  d.verify_connectivity(); break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("neo4j did not start")
          EOF
      - name: ingest the bookshop fixture (LLM off)
        working-directory: pipeline
        run: |
          kg-ingest-code --repo tests/fixtures/bookshop --name bookshop --scip off
          kg-domain --repo bookshop --no-llm
          kg-embed --repo bookshop
      - name: start the MCP server
        working-directory: mcp
        run: |
          go build -o kg-mcp .
          nohup ./kg-mcp -http 127.0.0.1:8000 > ../kg-mcp.log 2>&1 &
          for _ in $(seq 30); do curl -sf http://127.0.0.1:8000/healthz && break; sleep 1; done
      - name: kg-eval with gates
        working-directory: pipeline
        # Measured on the fixture: hit@8 0.93, MRR 0.81, impact recall 1.00 (deterministic). Answer gates apply only when
        # the server has the ask tool; otherwise the answer cases are reported as skipped.
        run: >
          kg-eval eval/fixture.yaml --json ../eval.json
          --min-hit 0.9 --min-mrr 0.7 --min-impact 1
          --min-citation-recall 0.5 --min-citation-validity 0.9
      - name: pytest with neo4j (writer, sources, backup, scale generator)
        working-directory: pipeline
        run: pytest -q
      - name: MCP load smoke test
        working-directory: mcp
        run: go run ./cmd/kg-load -url "$KG_MCP_URL" -repo bookshop -symbol-prefix order -clients 1,4 -duration 5s -out ../load.json
      - name: metrics endpoint
        run: curl -sf http://127.0.0.1:8000/metrics | grep kg_mcp_tool_calls_total
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration
          path: |
            eval.json
            load.json
            kg-mcp.log
            fake-embedder.log
          if-no-files-found: ignore
