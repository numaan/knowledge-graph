# Prefix for every resource this chart creates. The Dagster values below
# refer to "kg-postgres", "kg-credentials", etc. If you change the prefix,
# change those references too.
namePrefix: kg

# StorageClass for all PVCs created by this chart ("" = cluster default).
storageClass: ""

# Graph store: "neo4j" (default) or "age" (PostgreSQL + Apache AGE).
# With "age", the Neo4j StatefulSet is not deployed.
graph:
  backend: neo4j

# ---------------------------------------------------------------------------
# PostgreSQL: Dagster storage, pipeline metadata (checkpoints, queue,
# permissions, publication state) and, with graph.backend=age, the graph.
# ---------------------------------------------------------------------------
postgres:
  image: postgres:17.11-bookworm
  user: kg
  database: knowledge
  # Leave empty to generate a random password (kept across upgrades).
  password: ""
  extensions:
    # Create the "vector" and "age" extensions in the knowledge database.
    enabled: true
    # Install the extensions with apt-get at container start. This needs
    # egress to apt.postgresql.org. For production, build
    # images/postgres-age-pgvector/Dockerfile, set postgres.image to it and
    # set install to false.
    install: true
    packages:
      - postgresql-17-age=1.7.0~rc0-1.pgdg12+1
      - postgresql-17-pgvector=0.8.7-1.pgdg12+1
  persistence:
    size: 50Gi
  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits: { memory: 4Gi }

# ---------------------------------------------------------------------------
# Neo4j Community: graph + vector + full-text indexes.
# Community has no RBAC: keep it internal and let the MCP server apply
# Jira/Confluence permission filters.
# ---------------------------------------------------------------------------
neo4j:
  image: neo4j:2026.10.1-community
  # Leave empty to generate a random password (kept across upgrades).
  password: ""
  plugins: '["apoc"]'
  # Sized for about 10 million relationships. Measure and adjust.
  heapSize: 4G
  pageCacheSize: 4G
  persistence:
    size: 100Gi
  resources:
    requests: { cpu: "2", memory: 9Gi }
    limits: { memory: 10Gi }

# ---------------------------------------------------------------------------
# Docling Serve: PDF / DOCX / PPTX / HTML to structured JSON.
# ---------------------------------------------------------------------------
docling:
  enabled: true
  image: quay.io/docling-project/docling-serve:v1.38.2
  replicas: 1
  env: {}
  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits: { memory: 6Gi }

# ---------------------------------------------------------------------------
# Embeddings and reranker.
# selfHosted=true runs Hugging Face Text Embeddings Inference (CPU).
# selfHosted=false deploys nothing; set provider and put the API key in
# sources.credentials (for example VOYAGE_API_KEY).
# ---------------------------------------------------------------------------
models:
  selfHosted: true
  provider: voyage # used only when selfHosted=false
  # selfHosted=false: an OpenAI-compatible /v1/embeddings endpoint, e.g. Ollama
  # (http://ollama.ollama.svc:11434) with embeddings.model qwen3-embedding:0.6b.
  externalUrl: ""
  image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
  embeddings:
    model: Qwen/Qwen3-Embedding-0.6B
    dimensions: 1024
    cacheSize: 10Gi
    resources:
      requests: { cpu: "2", memory: 4Gi }
      limits: { memory: 8Gi }
  # Cross-encoder after RRF in search_graph, search_knowledge, ask and kg-search
  # (TEI /rerank). Off by default: it adds about 0.3 s per query on a CPU.
  # selfHosted=false: set externalUrl to any TEI /rerank endpoint instead.
  reranker:
    enabled: false
    model: BAAI/bge-reranker-v2-m3
    externalUrl: ""
    cacheSize: 10Gi
    resources:
      requests: { cpu: "2", memory: 4Gi }
      limits: { memory: 8Gi }

# ---------------------------------------------------------------------------
# LLM for domain extraction and requirement checks. The chart does not run
# the LLM: point it at Ollama, vLLM or any OpenAI-compatible endpoint. Put an
# API key in sources.credentials.LLM_API_KEY when the endpoint needs one.
# enabled=false extracts roles and entities only (no LLM calls).
# ---------------------------------------------------------------------------
llm:
  enabled: true
  provider: ollama        # ollama | openai (any OpenAI-compatible API)
  baseUrl: http://ollama.ollama.svc:11434
  model: qwen3.6:35b-a3b
  contextTokens: 16384
  summaryBudget: 300       # maximum LLM calls per summaries run; the rest get extractive text
  freshnessCheck: false    # true: the LLM checks stale document sections against the code
  freshnessBudget: 20      # maximum LLM calls per freshness run

# ---------------------------------------------------------------------------
# Source archive: raw snapshots of every ingested item, for replay and audit.
# Use a ReadWriteMany StorageClass when Dagster run pods can land on
# different nodes. Move to SeaweedFS (S3) when the archive outgrows a PVC.
# ---------------------------------------------------------------------------
archive:
  size: 100Gi
  accessMode: ReadWriteOnce
  mountPath: /archive

# ---------------------------------------------------------------------------
# Source systems. Non-secret settings go to the kg-endpoints ConfigMap.
# credentials go to the kg-source-credentials Secret. Set createSecret=false
# to manage that Secret yourself (same name, same keys).
# ---------------------------------------------------------------------------
sources:
  jira:
    baseUrl: ""   # https://your-org.atlassian.net
    projects: []  # project keys, e.g. [PREC, OPS]
    acceptanceField: ""  # custom field with acceptance criteria, e.g. customfield_10042
  confluence:
    baseUrl: ""   # https://your-org.atlassian.net (site root, without /wiki)
    spaces: []    # space keys, e.g. [ENG]
  git:
    repositories: [] # list of clone URLs
  # Data trust: secret and PII masking before graph writes, embeddings and LLM calls (mask | off),
  # and extra allow-list entries (literal values or re:<regex>), e.g. [ci@your-org.com]
  privacy:
    mode: mask
    allow: []
  github:          # pull requests and reviews; token: GITHUB_TOKEN in credentials
    repositories: [] # owner/repo or owner/repo=graph-name; empty uses the github.com URLs of git.repositories
    apiUrl: ""       # GitHub Enterprise: https://host/api/v3
  people:
    aliasesFile: ""  # path of people-aliases.yaml in the run pods (explicit identity merges)
  createSecret: true
  credentials: {}
  #  ATLASSIAN_EMAIL: bot@example.com
  #  ATLASSIAN_API_TOKEN: ...
  #  GIT_TOKEN: ...
  #  GITHUB_TOKEN: ...
  #  VOYAGE_API_KEY: ...
  #  ANTHROPIC_API_KEY: ...

# ---------------------------------------------------------------------------
# Agent-facing MCP server (your image). Disabled until you have an image.
# ---------------------------------------------------------------------------
mcp:
  enabled: false
  image: ""      # registry/kg-mcp:0.1.0, built from mcp/Dockerfile (Go, read-only, ~15 MB)
  replicas: 1
  port: 8000
  # ACL groups this server sees: "*" for all, or e.g. "repo:precept,jira:PREC,confluence:ENG".
  # Run one release per audience; read_cypher is off unless the value is "*".
  aclGroups: "*"
  defaultRepo: ""
  env: {}
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
  # Governance (docs/streams/governance.md). With oidc.enabled each caller sends a bearer token and
  # sees its own groups (mapped by aclMapping); aclGroups above is the upper bound.
  oidc:
    enabled: false
    issuer: ""            # https://sso.example.com/realms/kg; empty uses the dev Keycloak (keycloak.enabled)
    audience: kg-mcp      # the aud claim the token must carry
    groupsClaim: groups   # dotted paths such as realm_access.roles work
    jwksUrl: ""           # default: from the issuer's discovery document
    resource: ""          # public URL of /mcp, e.g. https://kg.example.com/mcp; default: from the request
    scopes: ""            # scopes every call needs, comma-separated
    writeScope: ""        # scope for report_wrong_fact, record_decision, suggest_link (e.g. kg:write)
  aclMapping: {}          # acl-mapping.yaml: {default: [], passthrough: true, groups: {team-x: [repo:x, jira:X]}}
  audit:
    mode: stdout          # stdout or off: one JSON line per tool call
    file: ""              # also append to this file in the pod
  writeback: true         # the three proposal tools; false removes them

# ---------------------------------------------------------------------------
# Dev Keycloak for the OIDC test on kind (start-dev, in-memory database, realm "kg" imported from
# files/keycloak/kg-realm.json). For production set mcp.oidc.issuer to your identity provider.
# ---------------------------------------------------------------------------
keycloak:
  enabled: false
  image: quay.io/keycloak/keycloak:26.4.2
  port: 8080
  realm: kg
  adminUser: admin        # the password is generated into the Secret <prefix>-keycloak
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }

# Web UI for humans (web/Dockerfile). It calls the REST layer of the MCP server (/api), so it
# sees what mcp.aclGroups allows. Off by default.
web:
  enabled: false
  image: ""      # registry/kg-web:0.1.0
  replicas: 1
  port: 3000
  apiUrl: ""     # default http://<release>-mcp:<mcp.port>
  # Optional login with Keycloak or another OIDC issuer; empty issuer = open (local mode).
  oidc:
    issuer: ""           # e.g. https://keycloak.example.com/realms/kg
    clientId: kg-web
    url: ""              # public URL of the web app, e.g. https://kg.example.com
    existingSecret: ""   # keys OIDC_CLIENT_SECRET and AUTH_SECRET
  env: {}
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

# ---------------------------------------------------------------------------
# Control API for the admin UI (docs/streams/admin.md): manages sources and starts Dagster runs.
# Off by default. It runs from the kg-pipeline image (needs the "control" extra, see pipeline/Dockerfile)
# and stores sources in the knowledge database of the chart PostgreSQL.
# To use the admin UI also set web.enabled=true. The web pod then gets CONTROL_API_URL.
# Dagster user code needs DATABASE_URL and KG_SECRET_KEY too: the dagster-user-deployments env below
# reads them from the Secret <namePrefix>-control (optional, so env-only installs keep working).
# ---------------------------------------------------------------------------
control:
  enabled: false
  image: ""      # the kg-pipeline image, e.g. registry/kg-pipeline:0.1.0
  replicas: 1
  port: 8090
  # KG_SECRET_KEY encrypts the secrets of sources (Fernet). Empty existingSecret: the chart generates a
  # key on first install and keeps it across upgrades in the Secret <namePrefix>-control.
  # WARNING: if the key is lost or changed, every stored source secret becomes unreadable.
  # With existingSecret (key name below), also change the KG_SECRET_KEY entry of the Dagster
  # user deployment env to read that Secret.
  secretKey:
    existingSecret: ""
    key: KG_SECRET_KEY
  # Token checks (the same Keycloak as the web app). An empty issuer is local mode without authentication:
  # every caller is admin. The chart refuses to render control.enabled=true with an empty issuer unless
  # allowLocalMode is true. Set it only for a local or kind install whose web app and Service are not public.
  allowLocalMode: false
  oidc:
    issuer: ""           # e.g. https://keycloak.example.com/realms/kg
    audience: ""         # aud claim the access token must carry (empty: not checked)
    groupsClaim: groups
    adminGroup: ""       # optional; sets KG_CONTROL_ADMIN_GROUP (the API requires kg-admins by default)
  dagster:
    host: ""             # default: <release>-dagster-webserver (Service of the Dagster chart)
    port: ""             # default: dagster.dagsterWebserver.service.port, else 80
    webserverUrl: ""     # public Dagster UI URL for links in runs (DAGSTER_WEBSERVER_URL); empty = no link
  # Extra env, e.g. KG_CONTROL_ALLOW_HTTP: "1" (allow http:// source URLs) or KG_CONTROL_ALLOW_PRIVATE: "1"
  # (allow connection tests to private addresses). Both are off by default (SSRF guard).
  env: {}
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

# ---------------------------------------------------------------------------
# Tracing: OTLP/HTTP endpoint for the MCP server and the pipeline, e.g.
# http://phoenix.observability.svc:6006 (Arize Phoenix) or
# https://langfuse.example.com/api/public/otel (Langfuse; put
# OTEL_EXPORTER_OTLP_HEADERS in sources.credentials). Empty = tracing off.
# The MCP server always serves Prometheus metrics at /metrics.
# ---------------------------------------------------------------------------
observability:
  otlpEndpoint: ""
  prometheusAnnotations: true   # prometheus.io/scrape annotations on the MCP pods

# ---------------------------------------------------------------------------
# Neo4j backup (CronJob, off by default): kg-backup dump, an online logical
# backup, to a folder on a PVC (default: the source archive PVC) or to
# S3-compatible storage (SeaweedFS, MinIO, AWS S3). Restore procedure:
# docs/streams/ops-eval.md.
# ---------------------------------------------------------------------------
backup:
  enabled: false
  image: ""          # the kg-pipeline image (pipeline/Dockerfile), e.g. registry/kg-pipeline:0.1.0
  schedule: "30 2 * * *"
  activeDeadlineSeconds: 7200
  target: pvc        # pvc | s3
  keep: 7            # pvc: number of backup files to keep (s3: use a bucket lifecycle rule)
  pvc:
    claimName: ""    # default: <namePrefix>-source-archive. Needs ReadWriteMany if pods land on other nodes.
    path: backups/neo4j
  s3:
    endpoint: ""     # e.g. http://seaweedfs-s3.seaweedfs.svc:8333; empty = AWS S3
    bucket: kg-backups
    prefix: neo4j/
    region: us-east-1
    secretName: ""   # Secret with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY
    image: amazon/aws-cli:2.39.3
    scratchSize: 20Gi  # emptyDir for the dump before the upload
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { memory: 2Gi }

# ---------------------------------------------------------------------------
# Dagster (official chart). Uses the PostgreSQL above, not its own.
# ---------------------------------------------------------------------------
global:
  postgresqlSecretName: kg-dagster-postgresql

dagster:
  enabled: true
  generatePostgresqlPasswordSecret: false
  postgresql:
    enabled: false
    postgresqlHost: kg-postgres
    postgresqlUsername: kg
    postgresqlDatabase: dagster
    service:
      port: 5432
  dagster-user-deployments:
    enabled: true
    deployments:
      # Replace the image with the kg-pipeline image (pipeline/Dockerfile):
      #   image: { repository: <registry>/kg-pipeline, tag: 0.1.0 }
      #   dagsterApiGrpcArgs: ["--module-name", "kg_pipeline.definitions"]
      - name: kg-pipeline
        image:
          repository: docker.io/dagster/user-code-example
          tag: 1.13.28
          pullPolicy: IfNotPresent
        dagsterApiGrpcArgs:
          - "--python-file"
          - "/example_project/example_repo/repo.py"
        port: 3030
        includeConfigInLaunchedRuns:
          enabled: true
        envConfigMaps:
          - name: kg-endpoints
        envSecrets:
          - name: kg-credentials
          - name: kg-source-credentials
        # Source registry (control.enabled=true): the Secret kg-control exists only then, so both
        # references are optional. includeConfigInLaunchedRuns copies them to the run pods.
        env:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef: { name: kg-control, key: DATABASE_URL, optional: true }
          - name: KG_SECRET_KEY
            valueFrom:
              secretKeyRef: { name: kg-control, key: KG_SECRET_KEY, optional: true }
        volumes:
          - name: source-archive
            persistentVolumeClaim:
              claimName: kg-source-archive
        volumeMounts:
          - name: source-archive
            mountPath: /archive
