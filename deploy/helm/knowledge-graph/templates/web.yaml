{{- if .Values.web.enabled }}
{{- $name := include "kg.name" . -}}
{{- $w := .Values.web -}}
{{- $sel := dict "ctx" $ "component" "web" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-web
  labels: {{- include "kg.labels" . | nindent 4 }}
spec:
  selector: {{- include "kg.selector" $sel | nindent 4 }}
  ports:
    - name: http
      port: {{ $w.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-web
  labels: {{- include "kg.labels" . | nindent 4 }}
spec:
  replicas: {{ $w.replicas }}
  selector:
    matchLabels: {{- include "kg.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels: {{- include "kg.selector" $sel | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: web
          image: {{ required "web.image is required when web.enabled=true" $w.image }}
          env:
            - name: PORT
              value: {{ $w.port | quote }}
            # The web app calls the REST layer of the MCP server (same pod network, no browser access needed).
            - name: KG_API_URL
              value: {{ $w.apiUrl | default (printf "http://%s-mcp:%v" $name .Values.mcp.port) | quote }}
            {{- if .Values.control.enabled }}
            # Admin UI: the proxy route /api/admin forwards to the control API.
            - name: CONTROL_API_URL
              value: {{ printf "http://%s-control:%v" $name .Values.control.port | quote }}
            {{- end }}
            {{- if $w.oidc.issuer }}
            - name: OIDC_ISSUER
              value: {{ $w.oidc.issuer | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ $w.oidc.clientId | quote }}
            - name: AUTH_URL
              value: {{ required "web.oidc.url (public URL of the web app) is required with OIDC" $w.oidc.url | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "web.oidc.existingSecret is required with OIDC" $w.oidc.existingSecret }}
                  key: OIDC_CLIENT_SECRET
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $w.oidc.existingSecret }}
                  key: AUTH_SECRET
            {{- end }}
            {{- range $k, $v := $w.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $w.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
          resources: {{- toYaml $w.resources | nindent 12 }}
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
