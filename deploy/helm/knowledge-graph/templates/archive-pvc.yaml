apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kg.name" . }}-source-archive
  labels: {{- include "kg.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ .Values.archive.accessMode | quote }}]
  {{- include "kg.storageClass" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.archive.size }}
