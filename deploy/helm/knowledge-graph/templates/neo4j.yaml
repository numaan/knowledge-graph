{{- if eq .Values.graph.backend "neo4j" }}
{{- $name := include "kg.name" . -}}
{{- $n := .Values.neo4j -}}
{{- $sel := dict "ctx" $ "component" "neo4j" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-neo4j
  labels: {{- include "kg.labels" . | nindent 4 }}
spec:
  selector: {{- include "kg.selector" $sel | nindent 4 }}
  ports:
    - name: http
      port: 7474
      targetPort: http
    - name: bolt
      port: 7687
      targetPort: bolt
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}-neo4j
  labels: {{- include "kg.labels" . | nindent 4 }}
spec:
  serviceName: {{ $name }}-neo4j
  replicas: 1
  selector:
    matchLabels: {{- include "kg.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels: {{- include "kg.selector" $sel | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 7474
      containers:
        - name: neo4j
          image: {{ $n.image }}
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-credentials
                  key: NEO4J_AUTH
            - name: NEO4J_PLUGINS
              value: {{ $n.plugins | quote }}
            - name: NEO4J_dbms_security_procedures_unrestricted
              value: "apoc.*"
            - name: NEO4J_server_memory_heap_initial__size
              value: {{ $n.heapSize | quote }}
            - name: NEO4J_server_memory_heap_max__size
              value: {{ $n.heapSize | quote }}
            - name: NEO4J_server_memory_pagecache_size
              value: {{ $n.pageCacheSize | quote }}
          ports:
            - name: http
              containerPort: 7474
            - name: bolt
              containerPort: 7687
          startupProbe:
            tcpSocket:
              port: bolt
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: bolt
            periodSeconds: 10
          resources: {{- toYaml $n.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "kg.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ $n.persistence.size }}
{{- end }}
