{{- $name := include "kg.name" . -}}
{{- $pg := .Values.postgres -}}
{{- $sel := dict "ctx" $ "component" "postgres" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-postgres-init
  labels: {{- include "kg.labels" . | nindent 4 }}
data:
  # Runs once, on an empty data directory. Pipeline code owns its own tables.
  01-init.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "CREATE DATABASE dagster;"
    {{- if $pg.extensions.enabled }}
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<'SQL'
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE EXTENSION IF NOT EXISTS age;
    {{- if eq .Values.graph.backend "age" }}
    LOAD 'age';
    SET search_path = ag_catalog, public;
    SELECT create_graph('kg');
    {{- end }}
    SQL
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-postgres
  labels: {{- include "kg.labels" . | nindent 4 }}
spec:
  selector: {{- include "kg.selector" $sel | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}-postgres
  labels: {{- include "kg.labels" . | nindent 4 }}
spec:
  serviceName: {{ $name }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "kg.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels: {{- include "kg.selector" $sel | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ $pg.image }}
          {{- $args := list "postgres" }}
          {{- if $pg.extensions.enabled }}
          {{- $args = concat $args (list "-c" "shared_preload_libraries=age") }}
          {{- end }}
          {{- if and $pg.extensions.enabled $pg.extensions.install }}
          command: ["bash", "-ec"]
          args:
            - |
              apt-get update
              apt-get install -y --no-install-recommends {{ join " " $pg.extensions.packages }}
              rm -rf /var/lib/apt/lists/*
              exec docker-entrypoint.sh {{ join " " $args }}
          {{- else }}
          args: {{- toYaml $args | nindent 12 }}
          {{- end }}
          env:
            - name: POSTGRES_USER
              value: {{ $pg.user | quote }}
            - name: POSTGRES_DB
              value: {{ $pg.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-credentials
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
          resources: {{- toYaml $pg.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: {{ $name }}-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "kg.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ $pg.persistence.size }}
