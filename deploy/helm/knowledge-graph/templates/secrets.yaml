{{- $name := include "kg.name" . -}}
{{- $credName := printf "%s-credentials" $name -}}
{{- $pg := .Values.postgres.password | default (include "kg.existingSecretValue" (dict "ctx" $ "secret" $credName "key" "POSTGRES_PASSWORD")) | default (randAlphaNum 24) -}}
{{- $neo := .Values.neo4j.password | default (include "kg.existingSecretValue" (dict "ctx" $ "secret" $credName "key" "NEO4J_PASSWORD")) | default (randAlphaNum 24) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $credName }}
  labels: {{- include "kg.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pg | quote }}
  NEO4J_PASSWORD: {{ $neo | quote }}
  NEO4J_AUTH: {{ printf "neo4j/%s" $neo | quote }}
---
# Read by the Dagster chart (global.postgresqlSecretName).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.postgresqlSecretName }}
  labels: {{- include "kg.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgresql-password: {{ $pg | quote }}
{{- if .Values.sources.createSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-source-credentials
  labels: {{- include "kg.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.sources.credentials }}
  {{ $k }}: {{ $v | quote }}
  {{- else }}
  {}
  {{- end }}
{{- end }}
